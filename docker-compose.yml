services:
  backend:
    build:
      context: ./back-end-dotnet
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_PATH: /app/data/retrovibe.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./front-end
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3333/api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
